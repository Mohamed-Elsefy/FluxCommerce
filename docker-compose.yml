name: fluxcommerce

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fluxcommerce-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -b -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - fluxcommerce

  redis:
    image: redis:8-alpine
    container_name: fluxcommerce-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fluxcommerce

  rabbitmq:
    image: rabbitmq:4-management
    container_name: fluxcommerce-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fluxcommerce

  smtp4dev:
    image: rnwood/smtp4dev:latest
    container_name: fluxcommerce-smtp4dev
    ports:
      - "2525:25"
      - "5000:80"
    restart: unless-stopped
    networks:
      - fluxcommerce

  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: fluxcommerce-stripe-cli
    environment:
      - STRIPE_API_KEY=${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required in .env}
    command: >
      listen
      --forward-to http://host.docker.internal:5260/api/payments/webhook
      --events payment_intent.succeeded,payment_intent.payment_failed,charge.succeeded,charge.updated,checkout.session.completed
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    networks:
      - fluxcommerce
    profiles:
      - stripe

volumes:
  sqlserver_data:
  redis_data:
  rabbitmq_data:

networks:
  fluxcommerce:
    driver: bridge
